<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GUDU MC | Profile</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    font-family:Arial,sans-serif;
    color:white;

    background:
    radial-gradient(
        circle at 50% 10%,
        #263d68 0%,
        #11182c 45%,
        #070a12 100%
    );

    padding:25px;
}

/* TOP BAR */

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;

    max-width:1100px;
    margin:auto;

    padding:15px 20px;

    background:rgba(10,16,30,.75);

    border:1px solid rgba(120,150,255,.2);

    border-radius:15px;

    backdrop-filter:blur(12px);
}

.logo{
    font-size:24px;
    font-weight:900;
    letter-spacing:3px;

    background:linear-gradient(
        90deg,
        white,
        #83a5ff,
        white
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.status{
    font-size:12px;
    color:#7dffad;
}

/* PROFILE */

.container{
    max-width:700px;
    margin:50px auto;
}

.profile-card{
    text-align:center;

    background:rgba(15,22,40,.88);

    border:1px solid rgba(120,150,255,.25);

    border-radius:25px;

    padding:40px 30px;

    box-shadow:
    0 0 40px rgba(70,100,255,.15),
    0 20px 60px rgba(0,0,0,.5);

    backdrop-filter:blur(15px);

    animation:show .8s ease;
}

@keyframes show{

    from{
        opacity:0;
        transform:translateY(30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

/* DP */

.avatar-wrapper{
    width:140px;
    height:140px;

    margin:0 auto 20px;

    position:relative;
}

.avatar{
    width:140px;
    height:140px;

    border-radius:50%;

    object-fit:cover;

    border:4px solid #718cff;

    box-shadow:
    0 0 25px rgba(90,120,255,.6);

    background:#111a2d;
}

/* DEFAULT AVATAR */

.default-avatar{
    width:140px;
    height:140px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:65px;

    background:
    linear-gradient(
        135deg,
        #263d68,
        #11182c
    );

    border:4px solid #718cff;

    box-shadow:
    0 0 25px rgba(90,120,255,.6);
}

/* NAME */

.name{
    font-size:30px;
    font-weight:800;

    margin-top:10px;
}

.email{
    color:#8995ae;
    margin-top:6px;
}

.uid{
    color:#56627b;
    font-size:11px;

    margin-top:8px;

    word-break:break-all;
}

/* BUTTONS */

.buttons{
    margin-top:30px;
}

.btn{
    width:100%;

    padding:15px;

    margin-top:12px;

    border-radius:12px;

    border:none;

    cursor:pointer;

    color:white;

    font-size:15px;

    font-weight:bold;

    transition:.3s;
}

.btn:hover{
    transform:translateY(-3px);
}

.applications{
    background:
    linear-gradient(
        135deg,
        #5578ff,
        #7655ff
    );

    box-shadow:
    0 0 20px rgba(85,120,255,.25);
}

.logout{
    background:#351923;
    border:1px solid #6b3040;
}

.logout:hover{
    box-shadow:
    0 0 20px rgba(255,70,100,.25);
}

/* APPLICATIONS */

#applicationsBox{
    display:none;

    margin-top:25px;

    text-align:left;

    background:rgba(10,16,30,.8);

    border:1px solid rgba(120,150,255,.2);

    border-radius:18px;

    padding:20px;
}

.application-title{
    text-align:center;

    font-size:22px;

    margin-bottom:18px;
}

.application-card{
    background:#111a2d;

    border:1px solid #293858;

    border-radius:14px;

    padding:18px;

    margin-top:12px;
}

.application-rank{
    font-size:20px;
    font-weight:bold;

    color:#91a5ff;
}

.application-info{
    color:#8d99b3;

    font-size:13px;

    margin-top:8px;

    line-height:1.7;
}

.pending{
    color:#ffd166;
    font-weight:bold;
}

.accepted{
    color:#6dff9c;
    font-weight:bold;
}

.rejected{
    color:#ff6678;
    font-weight:bold;
}

.empty{
    text-align:center;

    color:#8995ae;

    padding:20px;
}

/* LOADING */

.loading{
    color:#91a5ff;

    margin-top:15px;

    font-size:14px;
}

/* BACK */

.back{
    display:block;

    margin-top:25px;

    color:#7e8aa5;

    text-decoration:none;

    font-size:14px;
}

.back:hover{
    color:white;
}

/* MOBILE */

@media(max-width:600px){

    body{
        padding:15px;
    }

    .profile-card{
        padding:30px 20px;
    }

    .topbar{
        padding:13px 15px;
    }

    .logo{
        font-size:20px;
    }

    .name{
        font-size:25px;
    }

}

</style>

</head>


<body>


<!-- TOP BAR -->

<header class="topbar">

    <div class="logo">
        GUDU MC
    </div>

    <div
        class="status"
        id="status">

        ● CONNECTING

    </div>

</header>



<!-- PROFILE -->

<main class="container">

<section class="profile-card">


    <!-- PROFILE PHOTO -->

    <div class="avatar-wrapper">

        <img
            id="profilePhoto"
            class="avatar"
            src=""
            alt="Profile Picture"
            style="display:none;"
        >

        <div
            id="defaultAvatar"
            class="default-avatar">

            👤

        </div>

    </div>



    <!-- USER INFO -->

    <h1
        class="name"
        id="userName">

        Loading...

    </h1>


    <p
        class="email"
        id="userEmail">

        Loading...

    </p>


    <p
        class="uid"
        id="userUid">

    </p>



    <!-- BUTTONS -->

    <div class="buttons">


        <button
            class="btn applications"
            id="applicationsButton">

            📋 MY APPLICATIONS

        </button>


        <button
            class="btn logout"
            id="logoutButton">

            🚪 LOGOUT

        </button>


    </div>



    <!-- LOADING -->

    <div
        class="loading"
        id="loadingMessage">

    </div>



    <!-- APPLICATIONS -->

    <div id="applicationsBox">

        <div class="application-title">

            📋 MY APPLICATIONS

        </div>


        <div id="applicationsList">

        </div>

    </div>



    <a
        href="dashboard.html"
        class="back">

        ← Back to Dashboard

    </a>


</section>

</main>



<!-- ==========================================
     FIREBASE
========================================== -->

<script type="module">


import {

    auth,
    db,

    onAuthStateChanged,

    signOut,

    collection,
    query,
    where,
    getDocs

} from "./js/firebase-config.js";



/* ==========================================
   ELEMENTS
========================================== */

const userName =
    document.getElementById("userName");

const userEmail =
    document.getElementById("userEmail");

const userUid =
    document.getElementById("userUid");

const profilePhoto =
    document.getElementById("profilePhoto");

const defaultAvatar =
    document.getElementById("defaultAvatar");

const status =
    document.getElementById("status");

const logoutButton =
    document.getElementById("logoutButton");

const applicationsButton =
    document.getElementById("applicationsButton");

const applicationsBox =
    document.getElementById("applicationsBox");

const applicationsList =
    document.getElementById("applicationsList");

const loadingMessage =
    document.getElementById("loadingMessage");



/* ==========================================
   CURRENT USER
========================================== */

let currentUser = null;



/* ==========================================
   AUTH STATE
========================================== */

onAuthStateChanged(
    auth,
    async function(user){

        if(!user){

            window.location.href =
                "login.html";

            return;

        }


        currentUser = user;


        /* USER NAME */

        userName.textContent =
            user.displayName ||
            "GUDU PLAYER";


        /* EMAIL */

        userEmail.textContent =
            user.email ||
            "No email";


        /* UID */

        userUid.textContent =
            "UID: " + user.uid;


        /* PHOTO */

        if(user.photoURL){

            profilePhoto.src =
                user.photoURL;

            profilePhoto.style.display =
                "block";

            defaultAvatar.style.display =
                "none";

        }else{

            profilePhoto.style.display =
                "none";

            defaultAvatar.style.display =
                "flex";

        }


        /* STATUS */

        status.textContent =
            "● ONLINE";


        status.style.color =
            "#7dffad";

    }
);



/* ==========================================
   LOGOUT
========================================== */

logoutButton.addEventListener(
    "click",
    async function(){

        const confirmLogout =
            confirm(
                "Are you sure you want to logout?"
            );


        if(!confirmLogout){

            return;

        }


        try{

            logoutButton.disabled =
                true;

            logoutButton.textContent =
                "⏳ LOGGING OUT...";


            await signOut(auth);


            window.location.href =
                "login.html";


        }catch(error){

            console.error(error);


            alert(
                "❌ Logout failed.\n\n" +
                error.message
            );


            logoutButton.disabled =
                false;

            logoutButton.textContent =
                "🚪 LOGOUT";

        }

    }
);



/* ==========================================
   MY APPLICATIONS
========================================== */

applicationsButton.addEventListener(
    "click",
    async function(){

        if(!currentUser){

            alert(
                "❌ Please login first."
            );

            return;

        }


        applicationsBox.style.display =
            "block";


        applicationsList.innerHTML =
            "<div class='empty'>⏳ Loading applications...</div>";


        try{


            /*
             * Find applications belonging
             * to the currently logged-in user.
             */

            const applicationsQuery =
                query(

                    collection(
                        db,
                        "applications"
                    ),

                    where(
                        "uid",
                        "==",
                        currentUser.uid
                    )

                );


            const snapshot =
                await getDocs(
                    applicationsQuery
                );


            applicationsList.innerHTML =
                "";


            /* NO APPLICATIONS */

            if(snapshot.empty){

                applicationsList.innerHTML = `

                    <div class="empty">

                        📭 You have not submitted
                        any applications yet.

                        <br><br>

                        Go to Staff Apply and
                        submit an application.

                    </div>

                `;

                return;

            }



            /* APPLICATIONS */

            snapshot.forEach(
                function(doc){

                    const data =
                        doc.data();


                    const rank =
                        data.rank ||
                        "Unknown Rank";


                    const applicationStatus =
                        data.status ||
                        "Pending";


                    let statusClass =
                        "pending";


                    if(
                        applicationStatus
                        .toLowerCase()
                        === "accepted"
                    ){

                        statusClass =
                            "accepted";

                    }


                    if(
                        applicationStatus
                        .toLowerCase()
                        === "rejected"
                    ){

                        statusClass =
                            "rejected";

                    }


                    let dateText =
                        "Date unavailable";


                    if(data.createdAt){

                        try{

                            dateText =
                                data.createdAt
                                .toDate()
                                .toLocaleString();

                        }catch(error){

                            dateText =
                                "Date unavailable";

                        }

                    }


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "application-card";


                    card.innerHTML = `

                        <div class="application-rank">

                            ${rank.toUpperCase()}

                        </div>


                        <div class="application-info">

                            🎮 Username:
                            ${escapeHTML(
                                data.username ||
                                "Not provided"
                            )}

                            <br>

                            💬 Discord:
                            ${escapeHTML(
                                data.discord ||
                                "Not provided"
                            )}

                            <br>

                            📅 Submitted:
                            ${dateText}

                            <br>

                            📌 Status:

                            <span class="${statusClass}">

                                ${escapeHTML(
                                    applicationStatus
                                )}

                            </span>

                        </div>

                    `;


                    applicationsList.appendChild(
                        card
                    );

                }
            );


        }catch(error){

            console.error(
                "APPLICATION ERROR:",
                error
            );


            applicationsList.innerHTML = `

                <div class="empty">

                    ❌ Could not load applications.

                    <br><br>

                    ${escapeHTML(
                        error.message
                    )}

                </div>

            `;

        }

    }
);



/* ==========================================
   SECURITY
========================================== */

function escapeHTML(value){

    return String(value)

        .replaceAll("&","&amp;")

        .replaceAll("<","&lt;")

        .replaceAll(">","&gt;")

        .replaceAll('"',"&quot;")

        .replaceAll("'","&#039;");

}


</script>


</body>

</html>
