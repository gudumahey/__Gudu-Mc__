<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GUDU MC | Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Arial,sans-serif;

    background:
    radial-gradient(
        circle at 50% 20%,
        #263d68 0%,
        #11182c 45%,
        #070a12 100%
    );

    color:white;

    padding:20px;
}

.login-box{

    width:100%;
    max-width:430px;

    padding:35px;

    background:rgba(15,22,40,.9);

    border:1px solid rgba(120,150,255,.25);

    border-radius:20px;

    box-shadow:
    0 0 40px rgba(70,100,255,.2),
    0 20px 60px rgba(0,0,0,.5);

    backdrop-filter:blur(15px);

    animation:show .7s ease;
}

@keyframes show{

    from{
        opacity:0;
        transform:translateY(25px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

.logo{

    text-align:center;

    font-size:42px;

    font-weight:900;

    letter-spacing:5px;

    background:
    linear-gradient(
        90deg,
        white,
        #83a5ff,
        white
    );

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;
}

.subtitle{

    text-align:center;

    color:#9da9c4;

    margin-top:8px;

    margin-bottom:30px;
}

label{

    display:block;

    margin-bottom:7px;

    color:#cbd4eb;

    font-size:14px;
}

input{

    width:100%;

    padding:14px;

    margin-bottom:18px;

    border-radius:10px;

    border:1px solid #293655;

    background:#0b1120;

    color:white;

    outline:none;

    font-size:15px;
}

input:focus{

    border-color:#6685ff;

    box-shadow:
    0 0 12px rgba(102,133,255,.2);
}

.login-btn{

    width:100%;

    padding:15px;

    border:none;

    border-radius:10px;

    background:
    linear-gradient(
        135deg,
        #5578ff,
        #7655ff
    );

    color:white;

    font-weight:bold;

    font-size:16px;

    cursor:pointer;

    transition:.3s;
}

.login-btn:hover{

    transform:translateY(-2px);

    box-shadow:
    0 0 25px rgba(85,120,255,.5);
}

.google-btn{

    width:100%;

    margin-top:12px;

    padding:14px;

    border-radius:10px;

    border:1px solid #34415f;

    background:#111a2d;

    color:white;

    font-size:15px;

    cursor:pointer;

    transition:.3s;
}

.google-btn:hover{

    background:#18233b;
}

.google-btn:disabled,
.login-btn:disabled{

    opacity:.6;

    cursor:not-allowed;
}

.divider{

    display:flex;

    align-items:center;

    gap:10px;

    margin:22px 0;

    color:#68738c;

    font-size:12px;
}

.divider::before,
.divider::after{

    content:"";

    height:1px;

    flex:1;

    background:#293655;
}

.message{

    margin-top:15px;

    padding:10px;

    border-radius:8px;

    text-align:center;

    color:#ff8c9a;

    font-size:13px;

    word-break:break-word;
}

.signup{

    text-align:center;

    margin-top:22px;

    color:#8792aa;

    font-size:14px;
}

.signup a{

    color:#7d9aff;

    text-decoration:none;

    font-weight:bold;
}

.back{

    display:block;

    text-align:center;

    margin-top:20px;

    color:#66718a;

    text-decoration:none;

    font-size:13px;
}

@media(max-width:500px){

    .login-box{

        padding:25px 20px;
    }

    .logo{

        font-size:35px;
    }

}

</style>

</head>


<body>


<div class="login-box">


    <h1 class="logo">
        GUDU MC
    </h1>


    <p class="subtitle">
        Login to continue
    </p>


    <form id="loginForm">


        <label>
            Email
        </label>


        <input
            id="email"
            type="email"
            placeholder="Enter your email"
            required
        >


        <label>
            Password
        </label>


        <input
            id="password"
            type="password"
            placeholder="Enter your password"
            required
        >


        <button
            type="submit"
            class="login-btn"
            id="loginBtn">

            LOGIN

        </button>


    </form>


    <div class="divider">

        OR

    </div>


    <button
        type="button"
        class="google-btn"
        id="googleBtn">

        🔵 Continue with Google

    </button>


    <div
        id="message"
        class="message">
    </div>


    <div class="signup">

        Don't have an account?

        <a href="signup.html">

            Sign Up

        </a>

    </div>


    <a
        href="index.html"
        class="back">

        ← Back to GUDU MC

    </a>


</div>


<script type="module">


import {

    auth,

    googleProvider,

    signInWithPopup,

    signInWithEmailAndPassword

} from "./js/firebase-config.js";


const loginForm =
    document.getElementById("loginForm");


const googleBtn =
    document.getElementById("googleBtn");


const loginBtn =
    document.getElementById("loginBtn");


const message =
    document.getElementById("message");


/* ==========================================
   EMAIL LOGIN
========================================== */


loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const email =
            document
            .getElementById("email")
            .value
            .trim();


        const password =
            document
            .getElementById("password")
            .value;


        message.innerText =
            "Logging in...";


        loginBtn.disabled = true;


        try{


            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


            message.innerText =
                "✅ Login successful!";


            setTimeout(
                function(){

                    window.location.href =
                        "dashboard.html";

                },
                500
            );


        }

        catch(error){


            console.error(
                "EMAIL LOGIN ERROR:",
                error
            );


            message.innerText =
                "❌ " +
                error.code +
                "\n\n" +
                error.message;


            loginBtn.disabled = false;

        }

    }
);


/* ==========================================
   GOOGLE LOGIN
========================================== */


googleBtn.addEventListener(
    "click",
    async function(){


        message.innerText =
            "Opening Google login...";


        googleBtn.disabled = true;


        try{


            const result =
                await signInWithPopup(
                    auth,
                    googleProvider
                );


            console.log(
                "GOOGLE LOGIN SUCCESS:",
                result.user
            );


            message.innerText =
                "✅ Google login successful!";


            setTimeout(
                function(){

                    window.location.href =
                        "dashboard.html";

                },
                500
            );


        }

        catch(error){


            console.error(
                "GOOGLE LOGIN ERROR:",
                error
            );


            /*
             * IMPORTANT:
             * Show the REAL Firebase error.
             */

            message.innerText =
                "❌ " +
                error.code +
                "\n\n" +
                error.message;


            googleBtn.disabled = false;

        }

    }
);


</script>


</body>

</html>
